<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抄読会スケジューラー</title>
<style>
  :root { --main:#4f46e5; --main2:#7c3aed; --bg:#f3f4fa; --card:#fff; --line:#e6e7f0; --txt:#171a26; --sub:#6d7280; --ok:#16a34a; --ng:#dc2626; --shadow:0 8px 28px rgba(23,26,38,.07); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; background:linear-gradient(180deg,#e9ebff 0,#f3f4fa 300px); background-color:var(--bg); color:var(--txt); font-size:15px; line-height:1.55; }
  header { background:linear-gradient(120deg,#0b1026 0%,#1b1140 55%,#2a1065 100%); color:#fff; padding:16px 12px 14px; position:sticky; top:0; z-index:5; border-radius:0 0 22px 22px; box-shadow:0 10px 30px rgba(11,16,38,.45); overflow:hidden; }
  header::before { content:""; position:absolute; top:-70px; right:-50px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(99,102,241,.55),transparent 70%); }
  header::after { content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:linear-gradient(90deg,#22d3ee,#818cf8,#e879f9,#fbbf24); }
  header .brand { display:flex; align-items:center; gap:12px; position:relative; z-index:1; }
  header .logo { width:46px; height:46px; flex:none; display:flex; align-items:center; justify-content:center; font-size:23px; border-radius:14px; background:linear-gradient(135deg,#6366f1,#a855f7 60%,#ec4899); box-shadow:0 6px 18px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.35); }
  header h1 { margin:0; font-size:21px; font-weight:900; letter-spacing:.03em; line-height:1.25; }
  header .sub { font-size:9.5px; font-weight:700; letter-spacing:.32em; color:rgba(255,255,255,.55); margin-top:2px; }
  header .save { font-size:12px; opacity:.95; margin-top:8px; min-height:15px; color:#c7d2fe; position:relative; z-index:1; }
  main { max-width:640px; margin:0 auto; padding:16px 12px 44px; }
  /* PCでは横幅を広げて余白を詰める（2026-11-18 有馬の指摘） */
  header .brand, header .save { max-width:616px; margin-left:auto; margin-right:auto; }
  @media (min-width:900px) {
    main { max-width:880px; }
    header .brand, header .save { max-width:856px; }
    /* 候補日カードは1行に1つ（縦並び）に戻した（2026-11-18 有馬の指摘） */
  }
  @media (min-width:1280px) {
    main { max-width:1080px; }
    header .brand, header .save { max-width:1056px; }
  }
  .card { background:var(--card); border:1px solid rgba(23,26,38,.05); border-radius:18px; box-shadow:var(--shadow); padding:18px 16px; margin-bottom:16px; }
  .card h2 { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--sub); letter-spacing:.07em; margin:0 0 12px; }
  .card h2::before { content:""; width:4px; height:15px; border-radius:2px; background:linear-gradient(180deg,var(--main),var(--main2)); flex:none; }
  .next { background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#a855f7); color:#fff; border:none; }
  .next h2 { color:rgba(255,255,255,.85); }
  .next h2::before { background:#fff; }
  .next .big { font-size:22px; font-weight:800; line-height:1.55; }
  .next .presenter { background:rgba(255,255,255,.25); padding:1px 12px; border-radius:99px; white-space:nowrap; }
  .next .muted { color:rgba(255,255,255,.9); }
  .next .gcal { background:#fff; color:var(--main); border:none; box-shadow:0 4px 14px rgba(0,0,0,.18); }
  .muted { color:var(--sub); font-size:13px; }
  h2 { font-size:15px; margin:0 0 10px; }
  select { width:100%; font-size:16px; font-weight:600; padding:12px; border:1px solid var(--line); border-radius:12px; background:#f8f9ff; color:var(--txt); }
  .cand { border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:10px; background:#fcfcff; }
  .cand.decided { border-color:#c7d2fe; background:linear-gradient(180deg,#eef2ff,#f5f7ff); box-shadow:inset 0 0 0 1px #c7d2fe; }
  .cand.dead { opacity:.55; background:#f8fafc; }
  .tag-dead { background:#e2e8f0; color:#475569; }
  .cand .date { font-weight:800; font-size:17px; }
  .cand .cnt { background:#eef2ff; color:var(--main); font-weight:700; padding:2px 10px; border-radius:99px; font-size:13px; }
  .bar { height:8px; background:#e7e8f2; border-radius:99px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#6366f1,#22c55e); transition:width .4s ease; }
  .btns { display:flex; gap:10px; margin-top:10px; }
  .btns button { flex:1; font-size:16px; font-weight:700; padding:12px 0; border-radius:99px; border:1.5px solid var(--line); background:#fff; color:var(--txt); cursor:pointer; transition:all .15s ease; font-family:inherit; }
  .btns button:active { transform:scale(.97); }
  .btns button.sel-yes { background:linear-gradient(135deg,#16a34a,#22c55e); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(34,197,94,.35); }
  .btns button.sel-no { background:linear-gradient(135deg,#dc2626,#ef4444); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(239,68,68,.3); }
  .btns button.sel-maybe { background:linear-gradient(135deg,#d97706,#f59e0b); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(245,158,11,.3); }
  .grid { margin-top:8px; font-size:12.5px; color:var(--sub); line-height:2; word-break:break-all; }
  /* 出欠名簿は名前を1列に並べる（2026-11-18 有馬の指摘） */
  .roster { margin-top:10px; border-top:1px solid var(--line); }
  .rrow { display:flex; justify-content:space-between; align-items:center; padding:6px 2px; border-bottom:1px solid var(--line); font-size:14px; }
  .rrow:last-child { border-bottom:none; }
  .rrow .mk { font-weight:800; min-width:26px; text-align:center; }
  .rrow .mk.y { color:var(--ok); }
  .rrow .mk.n { color:var(--ng); }
  .rrow .mk.q { color:#d97706; }
  .rrow .mk.u { color:#c3c7d4; }
  .grid b { color:var(--txt); font-weight:600; }
  .actions { display:flex; flex-direction:column; gap:8px; }
  .actions button { font-size:15px; font-weight:700; padding:13px; border-radius:12px; border:none; background:linear-gradient(135deg,var(--main),var(--main2)); color:#fff; cursor:pointer; box-shadow:0 6px 16px rgba(79,70,229,.3); font-family:inherit; }
  .actions button.ghost { background:#fff; color:var(--main); border:1.5px solid #c7d2fe; box-shadow:none; }
  .actions button.danger { background:#fff; color:var(--ng); border:1.5px solid #fecaca; box-shadow:none; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:9px 4px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--sub); font-weight:600; font-size:11px; letter-spacing:.06em; }
  tr.inactive { color:#9ca3af; }
  tr.me td { background:#fffbeb; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; background:linear-gradient(135deg,#e0e7ff,#ede9fe); color:var(--main); margin-left:6px; }
  .gcal { display:inline-block; padding:9px 16px; border:1px solid #c7d2fe; border-radius:99px; background:#eef2ff; color:var(--main); text-decoration:none; font-weight:700; }
  .card.ask { border:2px solid #f59e0b; background:linear-gradient(180deg,#fffbeb,#fff7e0); }
  .banner-change { background:linear-gradient(135deg,#f59e0b,#f97316 55%,#ef4444); color:#fff; font-weight:800; font-size:16px; line-height:1.5; border-radius:18px; box-shadow:0 8px 24px rgba(249,115,22,.35); padding:14px 16px; margin-bottom:16px; text-align:center; }
  ul.log { margin:0; padding-left:18px; font-size:13px; line-height:1.8; color:#374151; }
  ul.log li::marker { color:var(--main); }
  .setup { text-align:center; padding:30px 10px; }
  .setup input { width:100%; font-size:14px; padding:10px; border:1px solid var(--line); border-radius:8px; margin:10px 0; }
  .setup button { font-size:15px; padding:11px 22px; border-radius:12px; border:none; background:linear-gradient(135deg,var(--main),var(--main2)); color:#fff; cursor:pointer; font-family:inherit; }
  .err { color:var(--ng); font-size:13px; margin-top:8px; white-space:pre-wrap; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">📚</div>
    <div>
      <h1>抄読会スケジューラー</h1>
      <div class="sub">JOURNAL CLUB SCHEDULER</div>
    </div>
  </div>
  <div class="save" id="saveState"></div>
</header>
<main id="app"><p class="muted" style="text-align:center;padding:30px 0;">読み込み中…</p></main>

<script>
"use strict";
/* ===== 設定 ===== */
const OWNER = "shootingstarTTS7";
const REPO  = "shodokai-scheduler";
const FILE  = "state.json";
const API   = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + FILE;
const NEED  = 4;              // 開催に必要な○の人数
const WINDOW = 4;             // v3: 表示する候補週の数（1週終わるごとに末尾へ1週足す。有馬の指示 2026-11-18）
const TIME_LABEL = "19:00–19:30";

/* ===== キー管理（URLの #k= から取り込み、端末に記憶） ===== */
let KEY = localStorage.getItem("shodokai_key") || "";
(function(){
  const m = location.hash.match(/k=([A-Za-z0-9_]+)/);
  if (m) { KEY = m[1]; localStorage.setItem("shodokai_key", KEY); history.replaceState(null, "", location.pathname + location.search); }
})();

/* ===== 日付ユーティリティ（JST基準） ===== */
let TODAY_OVERRIDE = null; /* テスト用フック（通常は null） */
function jstToday() {
  if (TODAY_OVERRIDE) return TODAY_OVERRIDE;
  return new Intl.DateTimeFormat("en-CA", { timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
}
function addDays(ymd, n) {
  const d = new Date(ymd + "T00:00:00+09:00"); d.setDate(d.getDate() + n);
  return new Intl.DateTimeFormat("en-CA", { timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
}
function nextTuesdays(afterYmd, count) {
  const out = []; let d = afterYmd;
  while (out.length < count) {
    d = addDays(d, 1);
    const wd = new Date(d + "T00:00:00+09:00").getDay(); // JSTの曜日（+09:00固定）
    if (wd === 2) out.push(d);
  }
  return out;
}
const WD = ["日","月","火","水","木","金","土"];
function fmtDate(ymd) {
  if (!ymd) return "—";
  const d = new Date(ymd + "T00:00:00+09:00");
  return (d.getMonth()+1) + "月" + d.getDate() + "日（" + WD[d.getDay()] + "）";
}
function fmtDateShort(ymd) {
  if (!ymd) return "未担当";
  const d = new Date(ymd + "T00:00:00+09:00");
  return (d.getMonth()+1) + "/" + d.getDate();
}

/* ===== 状態 ===== */
let S = null;        // state.json の内容
let sha = null;      // GitHub上の版番号
let saving = false;
let myId = localStorage.getItem("shodokai_me") || "";

function member(id){ return S.members.find(m => m.id === id); }
function activeMembers(){ return S.members.filter(m => m.active); }
function yesIds(date){
  const r = S.round.responses || {};
  return activeMembers().filter(m => r[m.id] && r[m.id][date] === "yes").map(m => m.id);
}
function maybeIds(date){
  const r = S.round.responses || {};
  return activeMembers().filter(m => r[m.id] && r[m.id][date] === "maybe").map(m => m.id);
}
/* その候補日が開催不可能か: ○になれる上限（○+？+未回答の現役メンバー数）が NEED 未満なら、
   残り全員が○でも開催人数に届かない（現役9名なら ×が6名になった時点で確定する）。
   2026-11-18 有馬の指示で追加 */
function dateImpossible(date){
  const resp = S.round.responses || {};
  let potential = 0;
  for (const m of activeMembers()) {
    const v = resp[m.id] && resp[m.id][date];
    if (v !== "no") potential++;
  }
  return potential < NEED;
}
/* 担当の優先順位（v1/v2系）: 担当回数が少ない順 → 前回担当から空いている順 → 五十音順。
   v3 は pickPresenterV3 側の順序（実効の直近3ヶ月回数 → 実効の直近1年回数 → 実効の直近担当日 → 五十音）を使う。
   （2026-11-18: v2 で一時 refCount 基準にしたが、有馬の指示で直近3ヶ月に戻した。2026-11-19: v3 のタイブレークに直近1年回数を追加） */
function priorityCmp(a, b){
  const ka = a.count;
  const kb = b.count;
  if (ka !== kb) return ka - kb;
  const la = a.lastDate || "0000-00-00", lb = b.lastDate || "0000-00-00";
  if (la !== lb) return la < lb ? -1 : 1;
  return a.yomi < b.yomi ? -1 : 1;
}
/* v2ラウンドかどうか（round.rules で分岐。未設定は v1 扱い） */
function isV2(){ return !!(S && S.round && S.round.rules === "v2"); }
/* v3: 週ごとに独立して開催・担当を決める方式（2026-11-18 有馬の指示で導入。
   ○がNEED名以上集まった週は、前の週が終わっていなくてもその週の開催と担当が決まる） */
function isV3(){ return !!(S && S.round && S.round.rules === "v3"); }
/* v2: 現役メンバー全員が全候補日に回答済み（○/×/？のいずれか）か */
function answeredAllV2(){
  const r = S.round, resp = r.responses || {};
  return activeMembers().every(m => r.candidates.every(d => {
    const v = resp[m.id] && resp[m.id][d];
    return v === "yes" || v === "no" || v === "maybe";
  }));
}
/* v2: 決定タイミングを迎えたか（全員回答、または最初の候補日の前日に到達） */
function decisionDueV2(){
  if (!isV2()) return false;
  if (jstToday() >= addDays(S.round.candidates[0], -1)) return true;
  return answeredAllV2();
}
function pickPresenter(date, excluded){
  const ys = yesIds(date).map(member).filter(m => !excluded.includes(m.id));
  ys.sort(priorityCmp);
  return ys.length ? ys[0].id : null;
}
/* 今日（JST）から対象日までの日数 */
function daysUntil(dateStr){
  const t0 = new Date(jstToday() + "T00:00:00+09:00");
  const t1 = new Date(dateStr + "T00:00:00+09:00");
  return Math.round((t1 - t0) / 86400000);
}
/* ===== v3（週ごと独立決定） ===== */
/* 担当の実効回数: 直近3ヶ月の実績（count）に、確定済み・未開催の担当予定を仮加算する。
   これにより、まだ終わっていない週の担当が次の週にも続けて選ばれることを防ぐ */
function effCount(m, exceptDate){
  let c = m.count;
  const dec = (S.round && S.round.decisions) || {};
  for (const d of Object.keys(dec)) if (d !== exceptDate && dec[d].presenterId === m.id) c++;
  return c;
}
/* 担当の実効の直近担当日: 実績の lastDate と、確定済みの担当予定日のうち最も新しい方 */
function effLast(m, exceptDate){
  let l = m.lastDate || "0000-00-00";
  const dec = (S.round && S.round.decisions) || {};
  for (const d of Object.keys(dec)) if (d !== exceptDate && dec[d].presenterId === m.id && d > l) l = d;
  return l;
}
/* 担当の実効の直近1年回数: 実績（refCount）に、確定済み・未開催の担当予定を仮加算する */
function effRefCount(m, exceptDate){
  let c = m.refCount;
  const dec = (S.round && S.round.decisions) || {};
  for (const d of Object.keys(dec)) if (d !== exceptDate && dec[d].presenterId === m.id) c++;
  return c;
}
/* v3 の担当選定の優先順位（2026-11-19 有馬の指示でタイブレークを追加）:
   実効の直近3ヶ月回数 → 実効の直近1年回数 → 実効の直近担当日が古い順 → 五十音順 */
function pickPresenterV3(date, excluded){
  const ys = yesIds(date).map(member).filter(m => m.active && !(excluded || []).includes(m.id));
  ys.sort((a, b) => {
    const ca = effCount(a, date), cb = effCount(b, date);
    if (ca !== cb) return ca - cb;
    const ra = effRefCount(a, date), rb = effRefCount(b, date);
    if (ra !== rb) return ra - rb;
    const la = effLast(a, date), lb = effLast(b, date);
    if (la !== lb) return la < lb ? -1 : 1;
    return a.yomi < b.yomi ? -1 : 1;
  });
  return ys.length ? ys[0].id : null;
}
/* その週を休会にする（担当が来れなくなり、開催まで1週間を切っている場合） */
function kyukaiDateV3(date, oldId, record){
  delete S.round.decisions[date];
  const vd = (S.round.voidDates = S.round.voidDates || []);
  if (!vd.includes(date)) vd.push(date);
  (S.round.voidKind = S.round.voidKind || {})[date] = "kyukai";
  if (record) pushHistory(fmtDate(date) + " の抄読会は、担当の " + (oldId ? member(oldId).name + " さんが来れなくなり、" : "") + "開催まで1週間を切っているため休会になりました", "kyukai");
}
/* 候補日の窓を転がす: 過ぎた候補日（開催記録済み、または未決定のまま終了）を外し、末尾に火曜日を足して WINDOW 件に保つ。
   決定済みで開催判定がまだの過去日は、判定（cron）が終わるまで残す */
function rollWindowV3(){
  const r = S.round, today = jstToday();
  const done = new Set((S.sessions || []).map(s => s.date));
  const kept = [];
  for (const date of r.candidates) {
    if (date < today && (done.has(date) || !(r.decisions || {})[date])) {
      if (r.decisions) delete r.decisions[date];
      for (const id of Object.keys(r.responses || {})) { if (r.responses[id]) delete r.responses[id][date]; }
      continue;
    }
    kept.push(date);
  }
  r.candidates = kept;
  if (!r.candidates.length) r.candidates = nextTuesdays(addDays(today, -1), WINDOW);
  while (r.candidates.length < WINDOW) {
    const last = r.candidates[r.candidates.length - 1];
    const base = last > today ? last : today;
    const nxt = nextTuesdays(base, 1)[0];
    if (!nxt || r.candidates.includes(nxt)) break;
    r.candidates.push(nxt);
  }
}
/* 開催実施の記録（v3・週単位）。cron の開催判定が同じ内容で行う */
function completeSessionV3(date){
  const dec = (S.round.decisions || {})[date]; if (!dec) return;
  const att = yesIds(date);
  S.sessions.push({ date: date, presenterId: dec.presenterId, attendees: att });
  if (dec.presenterId) { const p = member(dec.presenterId); if (p) { p.count += 1; p.refCount += 1; p.lastDate = date; } }
  pushHistory(fmtDate(date) + " の抄読会を開催済みにしました（担当：" + (dec.presenterId ? member(dec.presenterId).name : "?") + "）");
  delete S.round.decisions[date];
  rollWindowV3();
}
/* v3の決定同期: 候補日ごとに独立して、決定・繰り上げ・休会・流会・取消を行う */
function syncDecisionV3(record){
  const r = S.round;
  r.decisions = r.decisions || {};
  r.voidDates = r.voidDates || [];
  r.voidKind = r.voidKind || {};
  rollWindowV3();
  const now = new Date().toISOString();
  for (const date of [...r.candidates]) {
    if (r.voidDates.includes(date)) { if (r.decisions[date]) delete r.decisions[date]; continue; }
    const dec = r.decisions[date];
    if (dec) {
      if (!yesIds(date).includes(dec.presenterId)) {
        /* 担当が来れなくなった: 開催まで1週間以上あれば次点へ繰り上げ、切っていれば休会（有馬の文面どおり >=7日で繰り上げ） */
        if (daysUntil(date) < 7) { kyukaiDateV3(date, dec.presenterId, record); continue; }
        const next = pickPresenterV3(date, [dec.presenterId]);
        if (next) {
          r.decisions[date] = { presenterId: next, decidedAt: now };
          if (record) pushHistory(fmtDate(date) + " の担当が " + member(next).name + " さんに自動で繰り上がりました");
        } else { delete r.decisions[date]; }
      }
      if (r.decisions[date] && yesIds(date).length < NEED) {
        delete r.decisions[date];
        if (record) pushHistory(fmtDate(date) + " の開催確定が取り消されました（出席" + NEED + "名未満）");
      }
      continue;
    }
    if (dateImpossible(date)) {
      r.voidDates.push(date);
      r.voidKind[date] = "dead";
      if (record) pushHistory(fmtDate(date) + " は、出席できる方が" + NEED + "名に届かなくなったため流会になりました", "dead");
      continue;
    }
    if (yesIds(date).length >= NEED) {
      const p = pickPresenterV3(date, []);
      if (p) {
        r.decisions[date] = { presenterId: p, decidedAt: now };
        if (record) { pushHistory("開催日が " + fmtDate(date) + " に自動確定しました"); pushHistory(fmtDate(date) + " の担当が " + member(p).name + " さんに自動決定しました"); }
      }
    }
  }
}

/* 現在の決定を導出する（保存値ではなく常に再計算） */
function derive(){
  const r = S.round;
  /* v2: 初回決定はタイミング（全員回答 or 最初の候補日の前日）まで行わない。
     一度決定したラウンド（everDecided）は従来通りいつでも再計算する */
  if (r.rules === "v2" && !r.decidedDate && !r.everDecided && !decisionDueV2()) {
    return { date: null, presenterId: null, excluded: [], ask: null };
  }
  for (const date of r.candidates) {
    if (yesIds(date).length >= NEED) {
      const ex = (r.decidedDate === date) ? (r.excludedPresenters || []) : [];
      const ask = (r.ask && r.ask.forDate === date && r.decidedDate === date) ? r.ask : null;
      let pid;
      if (r.presenterOverride && yesIds(date).includes(r.presenterOverride) && !ex.includes(r.presenterOverride)) {
        pid = r.presenterOverride;
      } else if (ask) {
        pid = null;
      } else {
        pid = pickPresenter(date, ex);
      }
      return { date: date, presenterId: pid, excluded: ex, ask: ask };
    }
  }
  return { date: null, presenterId: null, excluded: [], ask: null };
}

/* ===== GitHub読み書き ===== */
async function loadState() {
  const res = await fetch(API, { headers: { "Authorization": "Bearer " + KEY, "Accept": "application/vnd.github+json" }, cache: "no-store" });
  if (res.status === 401 || res.status === 403 || res.status === 404) throw new Error("key");
  if (!res.ok) throw new Error("読み込みに失敗しました (" + res.status + ")");
  const j = await res.json();
  sha = j.sha;
  S = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, "")))));
}
async function saveState(message) {
  const body = { message: message, content: btoa(unescape(encodeURIComponent(JSON.stringify(S, null, 2)))), sha: sha, branch: "main" };
  const res = await fetch(API, { method: "PUT", headers: { "Authorization": "Bearer " + KEY, "Accept": "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (res.status === 409 || res.status === 422) throw new Error("conflict");
  if (!res.ok) throw new Error("保存に失敗しました (" + res.status + ")");
  const j = await res.json();
  sha = j.content.sha;
}
/* 競合したら最新を取り直して1回だけやり直す */
async function mutate(fn, message) {
  if (saving) return;
  saving = true; setSave("保存中…"); render();
  try {
    fn();
    syncDecision(true);
    await saveState(message);
    setSave("保存しました ✓");
  } catch (e) {
    if (e.message === "conflict") {
      try {
        await loadState(); fn(); syncDecision(true);
        await saveState(message);
        setSave("保存しました ✓");
      } catch (e2) { setSave(""); alert("他の人の更新と重なりました。画面を再読み込みしてからもう一度お試しください。"); }
    } else { setSave(""); alert(e.message); }
  }
  saving = false; render();
}
/* 次ラウンドを構築する（新しいラウンドは常に v2 ルール）。
   afterDate の次の火曜日から4件を候補にし、重なる日付の回答だけ引き継ぐ */
function buildNextRound(prev, afterDate) {
  const newCands = nextTuesdays(afterDate, 4);
  const keep = {};
  for (const id of Object.keys(prev.responses || {})) { keep[id] = {}; for (const nd of newCands) if (prev.responses[id][nd]) keep[id][nd] = prev.responses[id][nd]; }
  return { seq: (prev.seq || 1) + 1, rules: "v2", candidates: newCands, responses: keep, excludedPresenters: [], decidedDate: null, decidedAt: null, presenterId: null, presenterDecidedAt: null, ask: null, presenterOverride: null, everDecided: false };
}
/* v2: 決定タイミングを迎えたのに、どの候補日も○が NEED 名未満 → そのラウンドは見送り */
function skipRoundV2(record) {
  const r = S.round;
  if (record) pushHistory("候補日はいずれも出席" + NEED + "名未満のため、この回は見送りになりました（次回候補日に組み直しました）", "skip");
  S.round = buildNextRound(r, r.candidates[r.candidates.length - 1]);
}
/* 開催実施の記録（担当の回数+1・開催ログ追記・次ラウンド構築）。
   v1の「開催済み」ボタンと、cron の自動判定（v2）が同じ内容で行う */
function completeSession(d) {
  const att = yesIds(d.date);
  S.sessions.push({ date: d.date, presenterId: d.presenterId, attendees: att });
  if (d.presenterId) { const p = member(d.presenterId); p.count += 1; p.refCount += 1; p.lastDate = d.date; }
  pushHistory(fmtDate(d.date) + " の抄読会を開催済みにしました（担当：" + (d.presenterId ? member(d.presenterId).name : "?") + "）");
  S.round = buildNextRound(S.round, d.date);
}
/* 開催まで1週間を切って担当が来れなくなったため、その週を休会にする */
function cancelRoundKyukai(record, date, oldId) {
  const r = S.round;
  if (record && date) pushHistory(fmtDate(date) + " の抄読会は、担当の " + (oldId ? member(oldId).name + " さんが来れなくなり、" : "") + "開催まで1週間を切っているため休会になりました", "kyukai");
  S.round = buildNextRound(r, date);
}
/* 導出した決定と保存値を同期し、変化があれば履歴に残す（書き込みは呼び出し側） */
function syncDecision(record) {
  if (S.round.rules === "v3") { syncDecisionV3(record); return; }
  const r0 = S.round;
  /* v2・未決定ラウンド: 開催人数に届く見込みがなくなった候補日は、その時点で流会として確定させる
     （一度流会にした日は、後から回答が変わっても戻さない）。全候補日が流会なら回ごと見送りにして組み直す */
  if (r0.rules === "v2" && !r0.decidedDate) {
    r0.deadDates = r0.deadDates || [];
    for (const date of r0.candidates) {
      if (!r0.deadDates.includes(date) && dateImpossible(date)) {
        r0.deadDates.push(date);
        if (record) pushHistory(fmtDate(date) + " は、出席できる方が" + NEED + "名に届かなくなったため流会になりました", "dead");
      }
    }
    if (r0.candidates.length && r0.candidates.every(dt => r0.deadDates.includes(dt))) {
      if (record) pushHistory("全ての候補日が流会になったため、この回は見送りになりました（次回候補日に組み直しました）", "skip");
      S.round = buildNextRound(r0, r0.candidates[r0.candidates.length - 1]);
      return;
    }
  }
  const d = derive();
  const r = S.round;
  const now = new Date().toISOString();
  /* v2: 決定タイミングを迎えたのに決定できない（全候補日○不足）→ ラウンド見送り */
  if (r.rules === "v2" && !r.decidedDate && !r.everDecided && !d.date && decisionDueV2()) {
    skipRoundV2(record);
    return;
  }
  if (d.date !== r.decidedDate) {
    if (record) {
      if (d.date && r.decidedDate) pushHistory("開催日が変更になりました：" + fmtDate(r.decidedDate) + " → " + fmtDate(d.date), "datechange");
      else if (d.date) pushHistory("開催日が " + fmtDate(d.date) + " に自動確定しました");
      else pushHistory("開催日の確定が取り消されました（出席4名未満）");
    }
    if (d.date) r.everDecided = true;
    r.decidedDate = d.date; r.decidedAt = d.date ? now : null;
    r.excludedPresenters = d.excluded;
    r.presenterId = d.presenterId; r.presenterDecidedAt = d.presenterId ? now : null;
    r.ask = null; r.presenterOverride = null;
    if (record && d.presenterId) pushHistory("担当が " + member(d.presenterId).name + " さんに自動決定しました");
    return;
  }
  if (!d.date) return;
  /* 同じ開催日のまま、担当まわりに変化があった場合。
     担当への確認フロー（ask）は 2026-11-18 の有馬の指示で廃止し、7日ルールに一本化した:
     担当が来れなくなった場合、開催まで1週間以上あれば次点へ自動繰り上げ、1週間を切っていればその週は休会 */
  r.ask = null;
  if (d.presenterId !== r.presenterId) {
    const old = r.presenterId;
    const oldDropped = old && (!yesIds(d.date).includes(old) || (r.excludedPresenters || []).includes(old));
    if (old && oldDropped && daysUntil(d.date) <= 7) {
      cancelRoundKyukai(record, d.date, old);
      return;
    }
    if (record && d.presenterId && old) pushHistory("担当が " + member(d.presenterId).name + " さんに自動で繰り上がりました");
    r.presenterId = d.presenterId; r.presenterDecidedAt = d.presenterId ? now : null;
  }
}
function pushHistory(text, kind) {
  S.history = S.history || [];
  const entry = { at: new Date().toISOString(), text: text };
  if (kind) entry.kind = kind;
  S.history.unshift(entry);
  S.history = S.history.slice(0, 50);
}
function setSave(t){ document.getElementById("saveState").textContent = t; }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }

/* ===== 操作 ===== */
function onRespond(date, val) {
  if (!myId) { alert("先に名前を選んでください"); return; }
  mutate(() => {
    S.round.responses[myId] = S.round.responses[myId] || {};
    const cur = S.round.responses[myId][date];
    S.round.responses[myId][date] = (cur === val) ? undefined : val;
    if (S.round.responses[myId][date] === undefined) delete S.round.responses[myId][date];
    const v = S.round.responses[myId][date];
    pushHistory(member(myId).name + " さんが " + fmtDate(date) + " を " + (v === "yes" ? "○" : v === "no" ? "×" : v === "maybe" ? "？" : "未回答") + " にしました");
  }, "response update");
}
function onDone() {
  const d = derive(); if (!d.date) return;
  if (!confirm(fmtDate(d.date) + " の抄読会を「開催済み」にします。担当の " + (d.presenterId ? member(d.presenterId).name : "") + " さんの回数が+1され、次の候補日が表示されます。よろしいですか？")) return;
  mutate(() => { completeSession(d); }, "session completed");
}
function onSwap() {
  const d = derive(); if (!d.date || !d.presenterId) return;
  if (daysUntil(d.date) <= 7) {
    if (!confirm(fmtDate(d.date) + " は開催まで1週間を切っています。担当が来れない場合、その週は休会になります。休会にしてよろしいですか？")) return;
  } else if (!confirm("担当を " + member(d.presenterId).name + " さんから次点の方に交代します。よろしいですか？")) return;
  mutate(() => {
    S.round.excludedPresenters = [...(S.round.excludedPresenters || []), d.presenterId];
    pushHistory("担当交代の操作が行われました（前担当：" + member(d.presenterId).name + "）");
  }, "presenter swap");
}
function onSkip() {
  const d = derive(); if (!d.date) return;
  if (!confirm(fmtDate(d.date) + " の開催を流会にします。候補日はその次の火曜日から組み直されます。よろしいですか？")) return;
  mutate(() => {
    pushHistory(fmtDate(d.date) + " の開催が流会になりました");
    S.round = buildNextRound(S.round, d.date);
  }, "session skipped");
}
/* v3: その週だけを流会にする */
function onSkipV3(date) {
  if (!confirm(fmtDate(date) + " の開催を流会にします。この日は開催されません。よろしいですか？")) return;
  mutate(() => {
    delete S.round.decisions[date];
    const vd = (S.round.voidDates = S.round.voidDates || []);
    if (!vd.includes(date)) vd.push(date);
    (S.round.voidKind = S.round.voidKind || {})[date] = "skip";
    pushHistory(fmtDate(date) + " の開催が流会になりました", "skip");
  }, "session skipped");
}

/* ===== 起動 ===== */
async function boot() {
  if (!KEY) { render(); bindSetup(); return; }
  try {
    await loadState();
    /* 読み込み時点の決定同期（変化があれば保存して履歴化） */
    const snap = () => JSON.stringify([S.round.decidedDate, S.round.presenterId, S.round.ask ? S.round.ask.candidateId : null, S.round.seq, (S.round.deadDates || []).join(","), JSON.stringify(S.round.decisions || {}), (S.round.voidDates || []).join(","), (S.round.candidates || []).join(",")]);
    const before = snap();
    syncDecision(true);
    render();
    if (snap() !== before) {
      try { await saveState("decision sync"); } catch (e) { /* 次回に持ち越し */ }
    }
  } catch (e) {
    if (e.message === "key") {
      document.getElementById("app").innerHTML = setupHtml();
      document.getElementById("keyErr").textContent = "キーが違うか、権限がありません。LINEで案内されたリンクから開き直してください。";
      bindSetup();
    } else {
      document.getElementById("app").innerHTML = '<div class="card setup"><p>読み込みに失敗しました。</p><p class="muted">' + esc(e.message) + '</p><button onclick="location.reload()">再読み込み</button></div>';
    }
  }
}
function bindSetup() {
  const b = document.getElementById("keyBtn");
  if (b) b.addEventListener("click", () => {
    const v = document.getElementById("keyIn").value.trim();
    if (v) { KEY = v; localStorage.setItem("shodokai_key", KEY); boot(); }
  });
}
boot();
/* 他の人の変更を定期的に取り込む */
setInterval(async () => {
  if (!KEY || saving || document.hidden) return;
  try { await loadState(); syncDecision(false); render(); } catch (e) { /* 静かに失敗 */ }
}, 30000);
</script>
